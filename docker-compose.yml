version: "3.8"

services:
  euler:
    build:
      context: .
      args:
        # Default build is MOCK mode (no key) — safe for GitHub / any laptop.
        # For a live demo, supply these (e.g. from a local .env beside this file):
        #   LLM_PROVIDER=openrouter
        #   LLM_BASE_URL=https://openrouter.ai/api/v1
        #   LLM_API_KEY=sk-or-v1-...
        LLM_PROVIDER: ${LLM_PROVIDER:-mock}
        LLM_BASE_URL: ${LLM_BASE_URL:-}
        LLM_API_KEY: ${LLM_API_KEY:-}
        LLM_MODEL: ${LLM_MODEL:-nex-agi/nex-n2.5-pro:free}
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./dev.db
    volumes:
      - euler-data:/app/prisma
    restart: unless-stopped

volumes:
  euler-data:
